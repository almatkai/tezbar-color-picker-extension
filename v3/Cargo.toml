[package]
name = "tezbar-color-picker"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 AND MIT AND CC-BY-2.5"
description = "Standalone Rust color-picker extension for Tezbar"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "9f91afcc071c3f301414dc62b33cfeac7d89a0cf", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
tempfile = "3"
